[package]
name = "samply-report"
version = "0.1.0"
edition = "2024"
description = "perf report-style TUI for samply / Firefox Profiler profiles"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
ratatui = "0.30"
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wholesym = "0.8"
